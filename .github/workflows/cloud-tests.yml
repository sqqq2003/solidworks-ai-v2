name: Portable Python regression
on:
  push:
    branches: [dev/cloud-ai]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements-cloud.txt pyflakes==4.1.0
      - run: python work/check_undefined_names.py
      - run: python work/run_cloud_tests.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloud-results-${{ matrix.python }}
          path: results/cloud/latest*
