name: Portable Python regression
on:
  push:
    branches: [main, master, dev/cloud-ai, wb/issue6-five-modules-framework]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      # Linux/cloud profile: ezdxf only, no pywin32. The live-refusal tests
      # are deterministic via the SW_API_FORCE_NO_COM hook.
      - run: python -m pip install -r requirements-cloud.txt
      - name: Cloud regression
        run: python work/run_cloud_tests.py
      - name: Five-module offline demo
        run: python examples/issue6_framework_demo.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloud-results-${{ matrix.python }}
          path: |
            results/cloud/latest*
            runtime/issue6-demo/**
